name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glowbite-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Compile web app
        run: npm run build

      - name: Generate Android native project
        run: npx cap add android

      - name: Set barcode scanner Android minimum SDK
        run: sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle

      - name: Compile Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GlowBite-debug.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowBite-Android-APK
          path: GlowBite-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest debug APK on public Preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --title "GlowBite Preview APK" --notes "Automatic Android debug build from commit $GITHUB_SHA. Intended for sideload testing, not Play Store distribution."
          else
            gh release create preview --title "GlowBite Preview APK" --notes "Automatic Android debug build from commit $GITHUB_SHA. Intended for sideload testing, not Play Store distribution." --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload preview GlowBite-debug.apk --clobber
